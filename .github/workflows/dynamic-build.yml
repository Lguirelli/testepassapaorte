name: Dynamic application artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-next-server:
    runs-on: ubuntu-latest
    env:
      ALLOW_DEMO: 'true'
      DB_MODE: pglite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - name: Assemble standalone server
        shell: bash
        run: |
          mkdir -p dynamic-dist/.next
          cp -R .next/standalone/. dynamic-dist/
          cp -R .next/static dynamic-dist/.next/static
          cp -R public dynamic-dist/public
      - uses: actions/upload-artifact@v4
        with:
          name: passaporte-serra-negra-next-server
          path: dynamic-dist
