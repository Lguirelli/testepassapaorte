name: showcase-pages
on:
  push:
    branches: [main]
    paths:
      - 'showcase/**'
      - 'scripts/validate_showcase.py'
      - 'scripts/capture_showcase.py'
      - '.github/workflows/showcase-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate-showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_showcase.py
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python scripts/capture_showcase.py
      - uses: actions/upload-artifact@v4
        with:
          name: showcase-screenshots
          path: artifacts/showcase
  deploy-pages:
    needs: validate-showcase
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: showcase
      - name: Deploy visual showcase
        id: deployment
        uses: actions/deploy-pages@v4
