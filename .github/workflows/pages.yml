name: Deploy functional demo

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - 'styles.css'
      - 'visual-v2.css'
      - 'data.js'
      - 'app.js'
      - 'assets/**'
      - 'robots.txt'
      - 'site.webmanifest'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble Pages artifact from repository root
        shell: bash
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist
          cp index.html 404.html styles.css visual-v2.css data.js app.js robots.txt site.webmanifest .nojekyll pages-dist/
          cp -R assets pages-dist/assets
      - name: Upload functional site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
