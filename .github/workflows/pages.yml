name: Deploy functional demo

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - 'styles.css'
      - 'visual-v2.css'
      - 'visual.css'
      - 'partners-page.css'
      - 'tourism-pages.css'
      - 'theme.css'
      - 'data.js'
      - 'tourism-data.js'
      - 'partners-page.js'
      - 'icon-registry.js'
      - 'ui-config.js'
      - 'ui-shell.js'
      - 'app.js'
      - 'assets/**'
      - 'lugares/**'
      - 'parceiros/**'
      - 'para-parceiros/**'
      - 'robots.txt'
      - 'site.webmanifest'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble Pages artifact from repository root
        shell: bash
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist
          cp index.html 404.html styles.css visual-v2.css visual.css partners-page.css tourism-pages.css theme.css \
             data.js tourism-data.js partners-page.js icon-registry.js ui-config.js ui-shell.js app.js \
             robots.txt site.webmanifest .nojekyll pages-dist/
          cp -R assets pages-dist/assets
          for dir in lugares parceiros para-parceiros; do
            if [ -d "$dir" ]; then cp -R "$dir" "pages-dist/$dir"; fi
          done
      - name: Validate Pages artifact
        shell: bash
        run: |
          test -f pages-dist/index.html
          test -f pages-dist/theme.css
          test -f pages-dist/icon-registry.js
          test -f pages-dist/ui-config.js
          test -f pages-dist/ui-shell.js
          test -f pages-dist/tourism-data.js
          test -f pages-dist/partners-page.js
          test -d pages-dist/assets/icons-v3
      - name: Upload functional site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
