name: 01-quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Verify lockfile
        run: npm ci --ignore-scripts --dry-run --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Repository validation
        run: npm run validate:repo

      - name: Design System V1
        run: npm run design:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Next build
        run: npm run build
        env:
          PERSISTENCE_MODE: local

      - name: Quality summary
        if: always()
        run: |
          {
            echo '## Quality gate'
            echo ''
            echo '- lockfile'
            echo '- repository validation'
            echo '- Design System V1 tokens/typography'
            echo '- lint'
            echo '- typecheck'
            echo '- unit tests'
            echo '- Next build'
          } >> "$GITHUB_STEP_SUMMARY"
