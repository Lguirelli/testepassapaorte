name: 02-playwright

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright Chromium
    runs-on: ubuntu-latest
    env:
      PERSISTENCE_MODE: local
      AUTH_MODE: mock
      MAPS_MODE: mock
      ROUTES_MODE: mock
      WEATHER_MODE: mock
      ANALYTICS_MODE: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload Playwright HTML report
        id: html-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: artifacts/playwright-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screenshots, traces and videos
        id: results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-debug-results
          path: |
            artifacts/playwright
            artifacts/playwright-results
          if-no-files-found: ignore
          retention-days: 14

      - name: How to inspect this run
        if: always()
        run: |
          {
            echo '## Chromium + Playwright'
            echo ''
            echo 'O runner do GitHub não transmite uma janela gráfica ao vivo. Os logs acima são ao vivo; a tela é registrada em screenshots, vídeos e traces.'
            echo ''
            echo '[Baixar relatório HTML](${{ steps.html-report.outputs.artifact-url }})'
            echo ''
            echo '[Baixar screenshots/traces/vídeos](${{ steps.results.outputs.artifact-url }})'
            echo ''
            echo 'Para acompanhar visualmente durante a edição, abra um Codespace e execute `npm run pw:ui`.'
          } >> "$GITHUB_STEP_SUMMARY"
