name: 03-visual-audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-audit:
    name: Visual Audit
    runs-on: ubuntu-latest
    env:
      PERSISTENCE_MODE: local
      AUTH_MODE: mock
      MAPS_MODE: mock
      ROUTES_MODE: mock
      WEATHER_MODE: mock
      ANALYTICS_MODE: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture all visual surfaces
        run: npm run pw:visual

      - name: Build screenshot gallery
        if: always()
        run: node scripts/build-visual-gallery.mjs

      - name: Upload visual gallery
        id: gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: passaporte-visual-audit
          path: artifacts/visual-audit
          if-no-files-found: ignore
          retention-days: 14

      - name: Visual audit summary
        if: always()
        run: |
          {
            echo '## Visual audit'
            echo ''
            echo 'Capturas geradas em Chromium para desktop, tablet e mobile.'
            echo ''
            echo '[Baixar galeria visual](${{ steps.gallery.outputs.artifact-url }})'
            echo ''
            echo 'Depois de baixar, abra `index.html` dentro do artifact para navegar pelas telas.'
          } >> "$GITHUB_STEP_SUMMARY"
