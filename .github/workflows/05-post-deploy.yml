name: 05-post-deploy

on:
  workflow_run:
    workflows: ['04-pages']
    types: [completed]
  workflow_dispatch:
    inputs:
      site_url:
        description: 'URL completa do GitHub Pages. Deixe vazio para detectar automaticamente.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  post-deploy:
    name: Post-deploy Chromium
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Pages URL
        shell: bash
        env:
          INPUT_SITE_URL: ${{ inputs.site_url }}
          CONFIGURED_PAGES_URL: ${{ vars.PAGES_URL }}
        run: |
          if [ -n "$INPUT_SITE_URL" ]; then
            site="$INPUT_SITE_URL"
          elif [ -n "$CONFIGURED_PAGES_URL" ]; then
            site="$CONFIGURED_PAGES_URL"
          else
            repo="${GITHUB_REPOSITORY#*/}"
            owner="$GITHUB_REPOSITORY_OWNER"
            if [ "$repo" = "$owner.github.io" ]; then
              site="https://$owner.github.io/"
            else
              site="https://$owner.github.io/$repo/"
            fi
          fi
          echo "SITE_URL=$site" >> "$GITHUB_ENV"
          echo "Testando $site"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright Python
        run: pip install playwright

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Verify deployed site
        run: python scripts/post-deploy-check.py

      - name: Upload production screenshots
        id: prod
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-chromium
          path: artifacts/post-deploy
          if-no-files-found: ignore
          retention-days: 14

      - name: Post-deploy summary
        if: always()
        run: |
          {
            echo '## Pós-deploy Chromium'
            echo ''
            echo "URL: $SITE_URL"
            echo ''
            echo '[Baixar screenshots de produção](${{ steps.prod.outputs.artifact-url }})'
          } >> "$GITHUB_STEP_SUMMARY"
