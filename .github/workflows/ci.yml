name: Validate Full Next.js Product

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:static
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NODE_ENV: production
          SESSION_SECRET: ci-only-session-secret-000000000000000000000000000000
          IDENTITY_PEPPER: ci-only-identity-pepper-111111111111111111111111111111
          NEXT_PUBLIC_SITE_URL: https://example.invalid

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate
    env:
      DB_MODE: pglite
      PGLITE_PATH: .data/e2e-ci
      TEST_AUTH_BYPASS: '1'
      SESSION_SECRET: e2e-ci-session-secret-000000000000000000000000000000
      IDENTITY_PEPPER: e2e-ci-identity-pepper-111111111111111111111111111111
      NEXT_PUBLIC_SITE_URL: http://localhost:4173
      TOURIST_EMAIL: turista@passaporte.local
      TOURIST_PASSWORD: turista-local
      PARTNER_EMAIL: parceiro@passaporte.local
      PARTNER_PASSWORD: parceiro-local
      PARTNER_ID: partner-cafe-neblina
      ADMIN_EMAIL: admin@passaporte.local
      ADMIN_PASSWORD: admin-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare isolated E2E database
        run: npm run local:prepare
      - name: Install Playwright Chromium
        run: npm run playwright:install:ci
      - name: Run Playwright E2E + Axe
        run: npm run test:e2e
        env:
          E2E_SKIP_PREP: '1'
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            docs/validation/

