name: Validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: validation
          POSTGRES_PASSWORD: validation
          POSTGRES_DB: passaporte
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U validation -d passaporte" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://validation:validation@localhost:5432/passaporte
      DB_MODE: postgres
      ALLOW_DEMO: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate && npm run db:seed
      - run: node --import tsx scripts/verify-persistence.ts
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            artifacts/playwright
            playwright-report
            test-results
