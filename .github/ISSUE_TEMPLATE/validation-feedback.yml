name: Feedback de produto / experiência
description: Registrar observação de validação que não seja um bug técnico.
title: "[FEEDBACK] "
labels: ["validation", "feedback"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Área avaliada
      options:
        - Home / Explorar
        - Lugar / Parceiro
        - Admin
        - Roteiro
        - Calendário
        - Passaporte
        - Arquitetura / documentação
        - Outra
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Observação
      description: Descreva o que ficou claro, confuso ou precisa ser revisto.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impacto percebido
      description: Explique como isso afeta entendimento, uso ou decisão de produto.
  - type: textarea
    id: suggestion
    attributes:
      label: Sugestão opcional
