name: Bug de validação
description: Registrar defeito reproduzível encontrado durante a revisão do vertical slice.
title: "[VALIDAÇÃO] "
labels: ["validation", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Este repositório usa dados fictícios e não representa uma build de produção.
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Home / Explorar
        - Lugar / Parceiro
        - Admin
        - Roteiro
        - Calendário
        - Passaporte
        - Banco / persistência
        - Acessibilidade
        - CI / Playwright
        - Outra
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: "1. Abra...\n2. Clique...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado observado
    validations:
      required: true
  - type: input
    id: viewport
    attributes:
      label: Viewport / dispositivo
      placeholder: "1440x1000, 390x844, etc."
  - type: textarea
    id: evidence
    attributes:
      label: Evidência
      description: Screenshot, trace, log ou link para execução do GitHub Actions.
