<!doctype html>
<html lang="pt-BR" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#181818" />
  <link rel="icon" href="./assets/icons/passaporte.svg" type="image/svg+xml" />
  <meta name="description" content="Passaporte Serra Negra — demonstração navegável para validação." />
  <title>Passaporte Serra Negra — Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip" href="#app">Ir para o conteúdo</a>
  <div class="demo-banner">Modo de validação · conteúdo fictício</div>

    <a class="brand" href="#/" aria-label="Passaporte Serra Negra, página inicial">

      <span><small>Passaporte</small><strong>Serra Negra</strong></span>

    <button class="mobile-menu" type="button" data-action="toggle-menu" aria-expanded="false" aria-controls="main-nav">

    <nav id="main-nav" class="main-nav" aria-label="Navegação principal">

    <div><strong>Passaporte Serra Negra</strong><p>Protótipo funcional de validação. Todos os dados exibidos são sintéticos.</p></div>
    <nav aria-label="Rodapé"><a href="#/explorar">Explorar</a><a href="#/roteiro">Roteiro</a><a href="#/meu-passaporte">Passaporte</a><button class="linklike" data-action="reset-demo">Restaurar demo</button></nav>

  <script src="./data.js"></script>
  <script src="./app.js"></script>
