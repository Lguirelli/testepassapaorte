<!doctype html>
<html lang="pt-BR" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block" rel="stylesheet">
  <title>Catálogo de ícones · Passaporte Serra Negra</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../theme.css">
</head>
<body>
  <main class="icon-catalog">
    <div class="section-head"><div><p class="eyebrow">VALIDAÇÃO INTERNA</p><h1>Catálogo de ícones</h1><p>Renderização automática do registry usando Material Symbols Outlined via Google Fonts e currentColor.</p></div><label class="field">Tema<select id="catalog-theme"><option value="system">Sistema</option><option value="light">Claro</option><option value="dark">Escuro</option></select></label></div>
    <div class="icon-catalog-grid" id="catalog"></div>
  </main>
  <script src="../icon-registry.js"></script>
  <script>
    const root=document.documentElement,select=document.getElementById('catalog-theme'),catalog=document.getElementById('catalog');
    const entries=Object.entries(window.PSN_ICON.symbols).sort(([a],[b])=>a.localeCompare(b));
    catalog.innerHTML=entries.map(([key])=>`<article class="icon-catalog-card">${window.PSN_ICON.html(key,'',{size:28})}<strong>${key}</strong><code>${window.PSN_ICON.symbol(key)}</code></article>`).join('');
    const applyTheme=()=>{const t=select.value;root.dataset.theme=t;root.dataset.resolvedTheme=(t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))?'dark':'light'};select.addEventListener('change',applyTheme);matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(select.value==='system')applyTheme()});applyTheme();
  </script>
</body>
</html>
