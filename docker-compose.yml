services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: validation
      POSTGRES_PASSWORD: validation
      POSTGRES_DB: passaporte
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - validation-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validation -d passaporte"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  validation-db:
