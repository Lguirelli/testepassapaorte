services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: passaporte
      POSTGRES_USER: passaporte
      POSTGRES_PASSWORD: passaporte
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U passaporte -d passaporte"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - passaporte_pgdata:/var/lib/postgresql/data
volumes:
  passaporte_pgdata:
