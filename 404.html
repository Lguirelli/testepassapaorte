<!doctype html>
<html lang="pt-BR" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#E8E8E0">
  <link rel="icon" href="./assets/brand/logo-passaporte-serra-negra.svg" type="image/svg+xml">
  <title>Página não encontrada · Passaporte Serra Negra</title>
  <style>
    :root{--canvas:#E8E8E0;--surface:#F3F1EC;--text:#161618;--secondary:#403D3F;--muted:#5E5A50;--border:#8A8378;--action:#403D3F;--actionText:#F3F1EC;color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    [data-theme="dark"]{--canvas:#161618;--surface:#2C292A;--text:#F3F1EC;--secondary:#D4D1C7;--muted:#B8B1AA;--border:#817B7B;--action:#E8E8E0;--actionText:#161618;color-scheme:dark}
    @media(prefers-color-scheme:dark){[data-theme="system"]{--canvas:#161618;--surface:#2C292A;--text:#F3F1EC;--secondary:#D4D1C7;--muted:#B8B1AA;--border:#817B7B;--action:#E8E8E0;--actionText:#161618;color-scheme:dark}}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--canvas);color:var(--text)}.card{width:min(720px,100%);background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:clamp(28px,6vw,64px)}.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;font-weight:750}.brand img{width:52px;height:52px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-size:.72rem;font-weight:750;margin-top:36px}h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(2.8rem,8vw,5rem);line-height:.95;margin:.5rem 0 1rem}p{color:var(--secondary);line-height:1.65;max-width:55ch}.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:24px}a.button,button{min-height:44px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:.7rem 1rem;text-decoration:none;font:inherit;cursor:pointer}.primary{background:var(--action)!important;color:var(--actionText)!important;border-color:var(--action)!important}label{display:grid;gap:6px;margin-top:28px;font-weight:650}input{min-height:46px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:.7rem .8rem;font:inherit}input::placeholder{color:var(--muted)}.search{display:grid;grid-template-columns:1fr auto;gap:8px}:focus-visible{outline:3px solid var(--text);outline-offset:3px}@media(max-width:520px){.search{grid-template-columns:1fr}.actions{display:grid}.actions>*{width:100%;text-align:center}}
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" id="home-brand" href="./" aria-label="Passaporte Serra Negra, página inicial"><img src="./assets/brand/logo-passaporte-serra-negra.svg" alt=""><span>Passaporte Serra Negra</span></a>
    <p class="eyebrow">Erro 404</p>
    <h1>Este caminho não existe.</h1>
    <p>Você pode voltar ao início, explorar os conteúdos disponíveis ou pesquisar uma ideia para continuar navegando pela demonstração.</p>
    <form id="search-form"><label for="search">Pesquisar no Passaporte</label><div class="search"><input id="search" type="search" placeholder="Café, natureza, cultura…"><button class="primary" type="submit">Explorar</button></div></form>
    <div class="actions"><a class="button" id="home-link" href="./">Página inicial</a><a class="button" id="explore-link" href="./#/explorar">Explorar</a><a class="button" id="route-link" href="./#/roteiro">Montar roteiro</a></div>
  </main>
  <script>(function(){var theme=localStorage.getItem('psn-theme-v1')||'system';document.documentElement.dataset.theme=theme;var dark=theme==='dark'||(theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.querySelector('meta[name="theme-color"]').content=dark?'#161618':'#E8E8E0';var parts=location.pathname.split('/').filter(Boolean);var base=location.hostname.endsWith('github.io')&&parts.length?'/'+parts[0]+'/':'/';document.getElementById('home-brand').href=base;document.getElementById('home-link').href=base;document.getElementById('explore-link').href=base+'#/explorar';document.getElementById('route-link').href=base+'#/roteiro';document.getElementById('search-form').addEventListener('submit',function(e){e.preventDefault();var q=document.getElementById('search').value.trim();location.href=base+'#/explorar'+(q?'?q='+encodeURIComponent(q):'')})})()</script>
</body>
</html>
