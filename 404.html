<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Passaporte Serra Negra</title>
  <script>
    (()=>{
      const path=location.pathname.replace(/\/+$/,'');
      const parts=path.split('/').filter(Boolean);
      const known=['explorar','mapa','pontos-turisticos','roteiro','meu-passaporte','admin','parceiros','para-parceiros','privacidade','termos','cookies','acessibilidade','lugares','viagens'];
      let index=parts.findIndex(part=>known.includes(part));
      let route=index>=0?parts.slice(index).join('/') : '';
      if(route==='mapa') route='explorar?view=map';
      else if(route==='pontos-turisticos') route='explorar?relation=public_point';
      else if(route==='para-parceiros') route='parceiros';
      const root=index>=0?'../'.repeat(parts.length-index):'./';
      location.replace(`${root}index.html#/${route}`);
    })();
  </script>
</head>
<body><p>Redirecionando para o Passaporte Serra Negra…</p></body>
</html>
