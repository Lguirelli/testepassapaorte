<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />

  <title>Início · Passaporte Serra Negra</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#161618;background:#e8e8e0}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}.bridge{width:min(620px,100%);padding:32px;border:1px solid #c8c3b8;border-radius:22px;background:#f3f1ec}.bridge h1{margin:0 0 12px;font-size:clamp(1.8rem,6vw,3rem);line-height:1.05}.bridge p{line-height:1.6;color:#403d3f}.bridge nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.bridge a{display:inline-flex;min-height:44px;align-items:center;padding:10px 14px;border:1px solid #403d3f;border-radius:10px;color:inherit;text-decoration:none}.bridge code{padding:.15em .35em;border-radius:4px;background:#d4d1c7}
  </style>
</head>
<body>
  <main class="bridge">
    <p>Entrada de compatibilidade</p>
