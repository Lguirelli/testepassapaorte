  <title>Passaporte Serra Negra</title>
  <script>
    (function(){
      try{
        var selected=localStorage.getItem('psn-theme-v1')||'system';
        var dark=selected==='dark'||(selected==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme=selected;
        document.documentElement.dataset.resolvedTheme=dark?'dark':'light';
      }catch(e){
        document.documentElement.dataset.resolvedTheme=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
      }
    })();
  </script>
